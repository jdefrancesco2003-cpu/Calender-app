<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natural Language Calendar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2d5a3d;
      --primary-light: #3d7a4d;
      --primary-dark: #1d3a2d;
      --accent: #e8b44f;
      --accent-light: #f5d580;
      --bg-light: #f8f7f4;
      --bg-white: #ffffff;
      --text-dark: #2b2b2b;
      --text-muted: #6b6b6b;
      --border-color: #e0dcd7;
      --success: #4caf50;
      --error: #f44336;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f8f7f4 0%, #f3f1ed 100%);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      animation: slideDown 0.6s ease;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: -0.5px;
      color: var(--primary-dark);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 300;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .input-section {
      background: var(--bg-white);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.6s ease 0.1s backwards;
    }

    .input-section h2 {
      font-size: 1.3rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .input-group.flex-row {
      flex-direction: row;
      gap: 1rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea {
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s ease;
      background: var(--bg-light);
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--bg-white);
      box-shadow: 0 0 0 3px rgba(45, 90, 61, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    button {
      flex: 1;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-secondary:hover {
      background: var(--primary);
      color: white;
    }

    .btn-danger {
      background: var(--error);
      color: white;
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      flex: none;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .calendar-section {
      background: var(--bg-white);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.6s ease 0.2s backwards;
    }

    .calendar-section h2 {
      font-size: 1.3rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .month-nav {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .month-nav button {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      flex: none;
    }

    .month-year {
      font-size: 1.1rem;
      font-weight: 500;
      min-width: 150px;
      text-align: center;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .day-header {
      text-align: center;
      font-weight: 600;
      color: var(--primary);
      padding: 0.75rem 0;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .day-cell {
      aspect-ratio: 1;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.5rem;
      background: var(--bg-light);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .day-cell:hover {
      border-color: var(--primary);
      background: var(--bg-white);
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .day-cell.other-month {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .day-cell.today {
      background: rgba(45, 90, 61, 0.05);
      border-color: var(--primary);
      font-weight: 600;
    }

    .day-number {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 0.25rem;
    }

    .day-events {
      font-size: 0.65rem;
      color: var(--primary);
      overflow: hidden;
      line-height: 1.2;
    }

    .event-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: var(--primary);
      border-radius: 50%;
      margin-right: 2px;
    }

    .events-list {
      margin-top: 2rem;
      max-height: 400px;
      overflow-y: auto;
    }

    .events-list h3 {
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .event-item {
      background: var(--bg-light);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      border-left: 4px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideIn 0.3s ease;
    }

    .event-details {
      flex: 1;
    }

    .event-title {
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 0.25rem;
    }

    .event-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .event-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: 1rem;
    }

    .status-message {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      animation: slideDown 0.3s ease;
    }

    .status-message.success {
      background: rgba(76, 175, 80, 0.1);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status-message.error {
      background: rgba(244, 67, 54, 0.1);
      color: var(--error);
      border: 1px solid var(--error);
    }

    .loading {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @media (max-width: 768px) {
      .main-content {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.8rem;
      }

      .calendar-grid {
        gap: 0.25rem;
      }

      .day-cell {
        padding: 0.25rem;
      }

      .day-number {
        font-size: 0.75rem;
      }

      .event-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .event-actions {
        margin-left: 0;
        margin-top: 0.5rem;
        width: 100%;
      }

      .event-actions button {
        flex: 1;
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-light);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📅 Natural Language Calendar</h1>
      <p class="subtitle">Just type your event naturally. We'll parse it for you.</p>
    </header>

    <div id="status-message"></div>

    <div class="main-content">
      <!-- Input Section -->
      <div class="input-section">
        <h2>✨ Add Event</h2>
        
        <div class="input-group">
          <label for="event-input">Type your event (natural language)</label>
          <textarea id="event-input" placeholder="e.g., 'lunch tomorrow at noon' or 'dentist appointment next Tuesday at 2:30pm'"></textarea>
        </div>

        <button class="btn-primary" id="parse-btn" onclick="parseEvent()">Parse & Add Event</button>

        <div style="border-top: 1px solid var(--border-color); margin-top: 2rem; padding-top: 2rem;">
          <h3 style="font-size: 1rem; color: var(--primary); margin-bottom: 1rem;">Or add manually</h3>
          
          <div class="input-group">
            <label for="title-input">Event Title</label>
            <input type="text" id="title-input" placeholder="Event name">
          </div>

          <div class="input-group flex-row">
            <div style="flex: 1;">
              <label for="date-input">Date</label>
              <input type="date" id="date-input">
            </div>
            <div style="flex: 1;">
              <label for="time-input">Time (optional)</label>
              <input type="time" id="time-input">
            </div>
          </div>

          <div class="input-group">
            <label for="desc-input">Description</label>
            <textarea id="desc-input" placeholder="Add details..." style="min-height: 50px;"></textarea>
          </div>

          <button class="btn-secondary" id="manual-btn" onclick="addEventManually()">Add Event</button>
        </div>
      </div>

      <!-- Calendar Section -->
      <div class="calendar-section">
        <h2>
          <span>📆 Calendar</span>
          <div class="month-nav">
            <button class="btn-secondary" onclick="previousMonth()" style="flex: none; padding: 0.5rem;">←</button>
            <div class="month-year" id="month-year"></div>
            <button class="btn-secondary" onclick="nextMonth()" style="flex: none; padding: 0.5rem;">→</button>
          </div>
        </h2>

        <div class="calendar-grid" id="calendar-grid"></div>

        <div class="events-list">
          <h3>Upcoming Events</h3>
          <div id="upcoming-events"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let allEvents = [];

    // Initialize app
    async function init() {
      await loadEvents();
      renderCalendar();
      renderUpcomingEvents();
      setTodayDate();
    }

    // Load events from server
    async function loadEvents() {
      try {
        const response = await fetch('/api/events');
        allEvents = await response.json();
      } catch (err) {
        console.error('Error loading events:', err);
        showStatus('Error loading events', 'error');
      }
    }

    // Parse event from natural language
    async function parseEvent() {
      const input = document.getElementById('event-input').value.trim();
      
      if (!input) {
        showStatus('Please type an event', 'error');
        return;
      }

      const btn = document.getElementById('parse-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading">⏳</span> Parsing...';

      try {
        const response = await fetch('/api/events/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: input })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          showStatus('Could not parse event. Try: "lunch tomorrow at noon"', 'error');
        } else {
          showStatus(`✓ Added: ${data.title}`, 'success');
          document.getElementById('event-input').value = '';
          await loadEvents();
          renderCalendar();
          renderUpcomingEvents();
        }
      } catch (err) {
        showStatus('Error: Make sure the server is running and API key is set', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Parse & Add Event';
      }
    }

    // Add event manually
    async function addEventManually() {
      const title = document.getElementById('title-input').value.trim();
      const date = document.getElementById('date-input').value;
      const time = document.getElementById('time-input').value;
      const description = document.getElementById('desc-input').value.trim();

      if (!title || !date) {
        showStatus('Title and date are required', 'error');
        return;
      }

      try {
        const response = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            date,
            time: time || null,
            description
          })
        });

        const data = await response.json();
        showStatus(`✓ Added: ${data.title}`, 'success');
        
        document.getElementById('title-input').value = '';
        document.getElementById('date-input').value = '';
        document.getElementById('time-input').value = '';
        document.getElementById('desc-input').value = '';
        setTodayDate();

        await loadEvents();
        renderCalendar();
        renderUpcomingEvents();
      } catch (err) {
        showStatus('Error adding event', 'error');
      }
    }

    // Delete event
    async function deleteEvent(id) {
      if (!confirm('Delete this event?')) return;

      try {
        const response = await fetch(`/api/events/${id}`, { method: 'DELETE' });
        if (response.ok) {
          showStatus('Event deleted', 'success');
          await loadEvents();
          renderCalendar();
          renderUpcomingEvents();
        }
      } catch (err) {
        showStatus('Error deleting event', 'error');
      }
    }

    // Render calendar
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      document.getElementById('month-year').textContent = 
        currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDayOfWeek = firstDay.getDay();

      let html = '';
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      
      days.forEach(day => {
        html += `<div class="day-header">${day}</div>`;
      });

      // Previous month days
      const prevMonthDays = new Date(year, month, 0).getDate();
      for (let i = startingDayOfWeek - 1; i >= 0; i--) {
        html += `<div class="day-cell other-month">${prevMonthDays - i}</div>`;
      }

      // Current month days
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateStr = date.toISOString().split('T')[0];
        const isToday = dateStr === today.toISOString().split('T')[0];
        
        const dayEvents = allEvents.filter(e => e.date === dateStr);
        const hasEvents = dayEvents.length > 0;

        html += `<div class="day-cell ${isToday ? 'today' : ''}" onclick="filterByDate('${dateStr}')">
          <div class="day-number">${day}</div>
          ${hasEvents ? `<div class="day-events"><span class="event-dot"></span>${dayEvents.length}</div>` : ''}
        </div>`;
      }

      // Next month days
      const remainingCells = 42 - (startingDayOfWeek + daysInMonth);
      for (let i = 1; i <= remainingCells; i++) {
        html += `<div class="day-cell other-month">${i}</div>`;
      }

      document.getElementById('calendar-grid').innerHTML = html;
    }

    // Render upcoming events
    function renderUpcomingEvents() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const upcoming = allEvents
        .filter(e => new Date(e.date) >= today)
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .slice(0, 10);

      let html = '';
      if (upcoming.length === 0) {
        html = '<p style="color: var(--text-muted);">No upcoming events</p>';
      } else {
        upcoming.forEach(event => {
          const date = new Date(event.date);
          const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          
          html += `
            <div class="event-item">
              <div class="event-details">
                <div class="event-title">${event.title}</div>
                <div class="event-meta">${dateStr}${event.time ? ` at ${event.time}` : ''}</div>
              </div>
              <div class="event-actions">
                <button class="btn-danger" onclick="deleteEvent('${event.id}')">Delete</button>
              </div>
            </div>
          `;
        });
      }
      
      document.getElementById('upcoming-events').innerHTML = html;
    }

    // Month navigation
    function previousMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    function filterByDate(dateStr) {
      const dayEvents = allEvents.filter(e => e.date === dateStr);
      if (dayEvents.length > 0) {
        let html = '<h3>Events for ' + new Date(dateStr).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) + '</h3>';
        dayEvents.forEach(event => {
          html += `
            <div class="event-item">
              <div class="event-details">
                <div class="event-title">${event.title}</div>
                <div class="event-meta">${event.time ? event.time : 'All day'}${event.description ? ` • ${event.description}` : ''}</div>
              </div>
              <button class="btn-danger" onclick="deleteEvent('${event.id}')">Delete</button>
            </div>
          `;
        });
        document.getElementById('upcoming-events').innerHTML = html;
      }
    }

    // Set today's date in input
    function setTodayDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date-input').value = today;
    }

    // Show status message
    function showStatus(message, type) {
      const el = document.getElementById('status-message');
      el.innerHTML = message;
      el.className = `status-message ${type}`;
      setTimeout(() => {
        el.innerHTML = '';
        el.className = '';
      }, 4000);
    }

    // Keyboard shortcut
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        parseEvent();
      }
    });

    // Initialize on load
    window.addEventListener('load', init);
  </script>
</body>
</html>
