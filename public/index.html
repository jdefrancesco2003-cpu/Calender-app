<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calendar">
  <title>Calendar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      position: fixed;
    }

    :root {
      --primary: #4a9d6f;
      --primary-light: #5faf81;
      --primary-dark: #3a8d5f;
      --bg-dark: #1c1c1e;
      --bg-card: #2c2c2e;
      --bg-light: #3a3a3c;
      --text-primary: #ffffff;
      --text-secondary: #a1a1a6;
      --border-color: #424245;
      --success: #30b0c0;
      --error: #ff453a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      gap: 0;
    }

    header {
      padding: 16px 0 12px 0;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      gap: 0;
      padding: 0;
    }

    .section {
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 0;
    }

    .section-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .section-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      background: var(--bg-light);
      color: var(--text-primary);
      -webkit-appearance: none;
      appearance: none;
      min-height: 44px;
    }

    input::placeholder, textarea::placeholder {
      color: var(--text-secondary);
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--bg-light);
    }

    textarea {
      resize: none;
      min-height: 100px;
      font-size: 16px;
    }

    button {
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-appearance: none;
      appearance: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:active {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: var(--bg-light);
      color: var(--primary);
      border: 1.5px solid var(--primary);
      font-weight: 600;
    }

    .btn-secondary:active {
      background: var(--primary);
      color: white;
    }

    .btn-danger {
      background: var(--error);
      color: white;
      font-size: 14px;
      padding: 10px 14px;
      min-height: auto;
    }

    .btn-danger:active {
      opacity: 0.7;
    }

    button:disabled {
      opacity: 0.5;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-card);
    }

    .month-year {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .month-nav {
      display: flex;
      gap: 8px;
    }

    .month-nav button {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 8px;
      background: var(--bg-light);
      font-size: 18px;
      color: var(--text-primary);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 12px 16px;
      background: var(--bg-card);
    }

    .day-header {
      text-align: center;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 8px 0;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .day-cell {
      aspect-ratio: 1;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px;
      background: var(--bg-light);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      position: relative;
      transition: all 0.15s ease;
    }

    .day-cell:active {
      opacity: 0.7;
    }

    .day-cell.other-month {
      background: transparent;
      border-color: transparent;
      opacity: 0.3;
    }

    .day-cell.today {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      font-weight: 600;
    }

    .day-number {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .day-cell.today .day-number {
      color: white;
    }

    .day-events {
      font-size: 10px;
      color: var(--primary);
      margin-top: 2px;
    }

    .day-cell.today .day-events {
      color: rgba(255,255,255,0.9);
    }

    .events-container {
      padding: 12px 16px;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
    }

    .events-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .event-item {
      background: var(--bg-light);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid var(--primary);
    }

    .event-details {
      flex: 1;
      min-width: 0;
    }

    .event-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .event-meta {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .event-actions {
      margin-left: 8px;
    }

    .status-message {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      z-index: 1000;
      animation: slideDown 0.3s ease;
    }

    .status-message.success {
      background: var(--success);
      color: white;
    }

    .status-message.error {
      background: var(--error);
      color: white;
    }

    .section-tabs {
      display: flex;
      gap: 0;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-card);
    }

    .tab-button {
      flex: 1;
      padding: 12px 0;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
      min-height: auto;
    }

    .tab-button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .loading {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-secondary);
      font-size: 15px;
    }

    .divider {
      height: 1px;
      background: var(--border-color);
      margin: 16px 0;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 2px;
    }

    @supports (padding: max(0px)) {
      body {
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Calendar</h1>
      <p class="subtitle">Natural language events</p>
    </header>

    <div id="status-message"></div>

    <div class="section-tabs">
      <button class="tab-button active" onclick="showTab('calendar')">Calendar</button>
      <button class="tab-button" onclick="showTab('add')">Add Event</button>
    </div>

    <div class="main-content">
      
      <div id="calendar-tab" class="tab-content">
        <div class="calendar-header">
          <div class="month-year" id="month-year"></div>
          <div class="month-nav">
            <button onclick="previousMonth()">←</button>
            <button onclick="nextMonth()">→</button>
          </div>
        </div>
        
        <div class="calendar-grid" id="calendar-grid"></div>
        
        <div class="events-container">
          <div class="events-title">Upcoming</div>
          <div id="upcoming-events"></div>
        </div>
      </div>

      <div id="add-tab" class="tab-content" style="display: none;">
        <div class="section">
          <div class="section-title">Quick Add</div>
          <div class="section-subtitle">Type your event naturally</div>
          
          <div class="input-group">
            <textarea id="event-input" placeholder="e.g., lunch tomorrow at noon"></textarea>
          </div>
          <button class="btn-primary" onclick="parseEvent()">Add Event</button>

          <div class="divider"></div>

          <div class="section-title">Manual Entry</div>
          
          <div class="input-group">
            <label>Title</label>
            <input type="text" id="title-input" placeholder="Event name">
          </div>

          <div class="input-group">
            <label>Date</label>
            <input type="date" id="date-input">
          </div>

          <div class="input-group">
            <label>Time (optional)</label>
            <input type="time" id="time-input">
          </div>

          <div class="input-group">
            <label>Notes</label>
            <textarea id="desc-input" placeholder="Add details..."></textarea>
          </div>

          <button class="btn-secondary" onclick="addEventManually()">Save Event</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    let currentDate = new Date();
    let allEvents = [];

    async function init() {
      await loadEvents();
      renderCalendar();
      renderUpcomingEvents();
      setTodayDate();
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tab + '-tab').style.display = 'block';
      event.target.classList.add('active');
    }

    async function loadEvents() {
      try {
        const response = await fetch('/api/events');
        allEvents = await response.json();
      } catch (err) {
        console.error('Error loading events:', err);
        showStatus('Error loading events', 'error');
      }
    }

    async function parseEvent() {
      const input = document.getElementById('event-input').value.trim();
      
      if (!input) {
        showStatus('Type an event', 'error');
        return;
      }

      const btn = event.target;
      btn.disabled = true;
      btn.innerHTML = '<span class="loading">⏳</span>';

      try {
        const response = await fetch('/api/events/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: input })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          showStatus('Try: "lunch tomorrow at noon"', 'error');
        } else {
          showStatus(`✓ ${data.title} added`, 'success');
          document.getElementById('event-input').value = '';
          await loadEvents();
          renderCalendar();
          renderUpcomingEvents();
        }
      } catch (err) {
        showStatus('Error adding event', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Add Event';
      }
    }

    async function addEventManually() {
      const title = document.getElementById('title-input').value.trim();
      const date = document.getElementById('date-input').value;
      const time = document.getElementById('time-input').value;
      const description = document.getElementById('desc-input').value.trim();

      if (!title || !date) {
        showStatus('Title and date required', 'error');
        return;
      }

      try {
        const response = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, date, time: time || null, description })
        });

        const data = await response.json();
        showStatus(`✓ ${data.title} saved`, 'success');
        
        document.getElementById('title-input').value = '';
        document.getElementById('date-input').value = '';
        document.getElementById('time-input').value = '';
        document.getElementById('desc-input').value = '';
        setTodayDate();

        await loadEvents();
        renderCalendar();
        renderUpcomingEvents();
      } catch (err) {
        showStatus('Error saving event', 'error');
      }
    }

    async function deleteEvent(id) {
      try {
        const response = await fetch(`/api/events/${id}`, { method: 'DELETE' });
        if (response.ok) {
          showStatus('Event deleted', 'success');
          await loadEvents();
          renderCalendar();
          renderUpcomingEvents();
        }
      } catch (err) {
        showStatus('Error deleting', 'error');
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      document.getElementById('month-year').textContent = 
        currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDayOfWeek = firstDay.getDay();

      let html = '';
      const days = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      
      days.forEach(day => {
        html += `<div class="day-header">${day}</div>`;
      });

      const prevMonthDays = new Date(year, month, 0).getDate();
      for (let i = startingDayOfWeek - 1; i >= 0; i--) {
        html += `<div class="day-cell other-month">${prevMonthDays - i}</div>`;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateStr = date.toISOString().split('T')[0];
        const isToday = dateStr === today.toISOString().split('T')[0];
        
        const dayEvents = allEvents.filter(e => e.date === dateStr);

        html += `<div class="day-cell ${isToday ? 'today' : ''}" onclick="filterByDate('${dateStr}')">
          <div class="day-number">${day}</div>
          ${dayEvents.length > 0 ? `<div class="day-events">•</div>` : ''}
        </div>`;
      }

      const remainingCells = 42 - (startingDayOfWeek + daysInMonth);
      for (let i = 1; i <= remainingCells; i++) {
        html += `<div class="day-cell other-month">${i}</div>`;
      }

      document.getElementById('calendar-grid').innerHTML = html;
    }

    function renderUpcomingEvents() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const upcoming = allEvents
        .filter(e => new Date(e.date) >= today)
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .slice(0, 8);

      let html = '';
      if (upcoming.length === 0) {
        html = '<div class="empty-state">No upcoming events</div>';
      } else {
        upcoming.forEach(event => {
          const date = new Date(event.date);
          const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          
          html += `
            <div class="event-item">
              <div class="event-details">
                <div class="event-title">${event.title}</div>
                <div class="event-meta">${dateStr}${event.time ? ` • ${event.time}` : ''}</div>
              </div>
              <button class="btn-danger" onclick="deleteEvent('${event.id}')">Delete</button>
            </div>
          `;
        });
      }
      
      document.getElementById('upcoming-events').innerHTML = html;
    }

    function previousMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    function filterByDate(dateStr) {
      const dayEvents = allEvents.filter(e => e.date === dateStr);
      if (dayEvents.length > 0) {
        let html = '<div class="events-title">' + new Date(dateStr).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }) + '</div>';
        dayEvents.forEach(event => {
          html += `
            <div class="event-item">
              <div class="event-details">
                <div class="event-title">${event.title}</div>
                <div class="event-meta">${event.time ? event.time : 'All day'}${event.description ? ' • ' + event.description : ''}</div>
              </div>
              <button class="btn-danger" onclick="deleteEvent('${event.id}')">Delete</button>
            </div>
          `;
        });
        document.getElementById('upcoming-events').innerHTML = html;
      }
    }

    function setTodayDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date-input').value = today;
    }

    function showStatus(message, type) {
      const el = document.getElementById('status-message');
      el.innerHTML = message;
      el.className = `status-message ${type}`;
      setTimeout(() => {
        el.innerHTML = '';
        el.className = '';
      }, 3000);
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
