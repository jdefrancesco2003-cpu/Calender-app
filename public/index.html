<html lang="en">

  <title>Calendar</title>
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%234a9d6f' width='180' height='180'/><rect fill='%232c2c2e' x='15' y='35' width='150' height='130' rx='12'/><rect fill='%234a9d6f' x='25' y='45' width='130' height='30'/><circle fill='%234a9d6f' cx='40' cy='62' r='3.5'/><circle fill='%234a9d6f' cx='90' cy='62' r='3.5'/><circle fill='%234a9d6f' cx='140' cy='62' r='3.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='25' y='80' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='55' y='80' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='85' y='80' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='115' y='80' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='25' y='110' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='55' y='110' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='85' y='110' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='115' y='110' width='20' height='20' rx='2.5'/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%234a9d6f' width='180' height='180'/><rect fill='%232c2c2e' x='15' y='35' width='150' height='130' rx='12'/><rect fill='%234a9d6f' x='25' y='45' width='130' height='30'/><circle fill='%234a9d6f' cx='40' cy='62' r='3.5'/><circle fill='%234a9d6f' cx='90' cy='62' r='3.5'/><circle fill='%234a9d6f' cx='140' cy='62' r='3.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='25' y='80' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='55' y='80' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='85' y='80' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='115' y='80' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='25' y='110' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='55' y='110' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='85' y='110' width='20' height='20' rx='2.5'/><rect fill='none' stroke='%234a9d6f' stroke-width='1.8' x='115' y='110' width='20' height='20' rx='2.5'/">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; position: fixed; }
    :root { --primary: #4a9d6f; --primary-light: #5faf81; --primary-dark: #3a8d5f; --bg-dark: #1c1c1e; --bg-card: #2c2c2e; --bg-light: #3a3a3c; --text-primary: #ffffff; --text-secondary: #a1a1a6; --border-color: #424245; --success: #30b0c0; --error: #ff453a; --warning: #ff9500; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; background: var(--bg-dark); color: var(--text-primary); padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); overflow: hidden; display: flex; flex-direction: column; }
    .container { display: flex; flex-direction: column; height: 100%; overflow: hidden; gap: 0; }
    header { padding: 16px 0 12px 0; border-bottom: 1px solid var(--border-color); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: var(--text-primary); }
    .header-actions { display: flex; gap: 8px; }
    .header-btn { background: var(--bg-light); border: none; color: var(--text-primary); padding: 8px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; -webkit-appearance: none; }
    .header-btn.active { background: var(--primary); }
    .main-content { display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; gap: 0; padding: 0; }
    .section { background: var(--bg-card); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 0; }
    .section-title { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .section-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 13px; font-weight: 600; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.5px; }
    input, textarea { padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 16px; font-family: inherit; background: var(--bg-light); color: var(--text-primary); -webkit-appearance: none; appearance: none; min-height: 44px; }
    input::placeholder, textarea::placeholder { color: var(--text-secondary); }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); background: var(--bg-light); }
    textarea { resize: none; min-height: 100px; font-size: 16px; }
    button { padding: 16px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; min-height: 48px; display: flex; align-items: center; justify-content: center; -webkit-appearance: none; appearance: none; position: relative; overflow: hidden; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:active { background: var(--primary-dark); }
    .btn-primary.loading::after { content: ''; position: absolute; top: 0; left: 0; height: 100%; background: rgba(255, 255, 255, 0.2); animation: loadingBar 2s ease-in-out forwards; }
    .btn-primary.loading { pointer-events: none; }
    .btn-secondary { background: var(--bg-light); color: var(--primary); border: 1.5px solid var(--primary); font-weight: 600; }
    .btn-secondary:active { background: var(--primary); color: white; }
    .btn-danger { background: var(--error); color: white; font-size: 14px; padding: 10px 14px; min-height: auto; }
    .btn-danger:active { opacity: 0.7; }
    button:disabled { opacity: 0.5; pointer-events: none; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-color); background: var(--bg-card); }
    .month-year { font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .month-nav { display: flex; gap: 8px; }
    .month-nav button { width: 40px; height: 40px; padding: 0; border-radius: 8px; background: var(--bg-light); font-size: 18px; color: var(--text-primary); min-height: auto; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 12px 16px; background: var(--bg-card); }
    .day-header { text-align: center; font-weight: 600; color: var(--text-secondary); padding: 8px 0; font-size: 12px; letter-spacing: 0.5px; }
    .day-cell { aspect-ratio: 1; border: 2px solid var(--border-color); border-radius: 8px; padding: 6px; background: var(--bg-light); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 44px; position: relative; transition: all 0.15s ease; font-size: 12px; }
    .day-cell:active { opacity: 0.7; }
    .day-cell.other-month { background: transparent; border-color: transparent; opacity: 0.3; }
    .day-cell.today { border: 2px solid var(--primary); background: var(--bg-light); color: var(--text-primary); font-weight: 600; box-shadow: 0 0 0 1px var(--primary); }
    .day-cell.selected { background: var(--primary); border-color: var(--primary); color: white; font-weight: 600; }
    .day-number { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .day-cell.selected .day-number { color: white; }
    .day-count { font-size: 10px; color: var(--primary); margin-top: 2px; }
    .day-cell.selected .day-count { color: rgba(255,255,255,0.9); }
    .week-view-container { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
    .week-header { display: grid; grid-template-columns: 60px repeat(7, 1fr); gap: 0; padding: 0 16px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); }
    .week-time-label { padding: 12px 0; font-size: 11px; color: var(--text-secondary); text-align: center; }
    .week-day-header { padding: 12px 8px; text-align: center; border-right: 1px solid var(--border-color); }
    .week-day-header:last-child { border-right: none; }
    .week-day-name { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .week-day-date { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-top: 2px; }
    .week-day-date.today { color: var(--primary); }
    .week-grid { display: grid; grid-template-columns: 60px repeat(7, 1fr); gap: 0; flex: 1; overflow-y: auto; background: var(--bg-card); padding: 0 16px; position: relative; }
    .week-time-slots { display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
    .time-slot { padding: 12px 0; font-size: 11px; color: var(--text-secondary); text-align: right; padding-right: 8px; min-height: 60px; border-bottom: 1px solid var(--border-color); }
    .week-day-column { border-right: 1px solid var(--border-color); position: relative; min-height: 100%; }
    .week-day-column:last-child { border-right: none; }
    .week-day-column.today { background: rgba(74, 157, 111, 0.05); }
    .week-day-column.today::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--primary); }
    .week-event { position: absolute; background: var(--bg-light); border-left: 3px solid var(--primary); border-radius: 6px; padding: 6px 8px; font-size: 12px; cursor: pointer; overflow: hidden; margin: 2px; left: 2px; right: 2px; }
    .week-event-title { font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .week-event-time { font-size: 10px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .events-container { padding: 12px 16px; background: var(--bg-card); border-top: 1px solid var(--border-color); overflow-y: auto; }
    .sidebar-section { margin-bottom: 20px; }
    .sidebar-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .events-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .event-item { background: var(--bg-light); padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; border-left: 4px solid var(--primary); cursor: pointer; transition: all 0.15s ease; }
    .event-item:active { opacity: 0.8; background: var(--bg-light); }
    .event-details { flex: 1; min-width: 0; }
    .event-title { font-weight: 600; font-size: 15px; color: var(--text-primary); margin-bottom: 4px; }
    .event-meta { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
    .event-duration { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
    .status-message { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; padding: 12px 16px; border-radius: 10px; font-size: 15px; font-weight: 500; z-index: 1000; animation: slideDown 0.3s ease; }
    .status-message.success { background: var(--success); color: white; }
    .status-message.error { background: var(--error); color: white; }
    .section-tabs { display: flex; gap: 0; padding: 0 16px; border-bottom: 1px solid var(--border-color); background: var(--bg-card); }
    .tab-button { flex: 1; padding: 12px 0; background: none; border: none; border-bottom: 3px solid transparent; font-size: 15px; font-weight: 600; color: var(--text-secondary); min-height: auto; }
    .tab-button.active { color: var(--primary); border-bottom-color: var(--primary); }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 2000; padding: max(12px, env(safe-area-inset-top)) 12px 12px 12px; animation: fadeIn 0.2s ease; }
    .modal-overlay.active { display: flex; align-items: flex-end; }
    .modal { background: var(--bg-card); border-radius: 20px 20px 0 0; width: 100%; max-height: 80vh; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .modal h3 { font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .confirmation-modal { padding: 24px 20px; }
    .confirmation-content { margin-bottom: 20px; }
    .confirmation-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; }
    .confirmation-detail { background: var(--bg-light); padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
    .confirmation-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
    .confirmation-value { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .confirmation-buttons { display: flex; gap: 8px; }
    .confirmation-buttons button { flex: 1; }
    .empty-state { text-align: center; padding: 32px 16px; color: var(--text-secondary); font-size: 15px; line-height: 1.5; }
    .empty-state-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }
    .divider { height: 1px; background: var(--border-color); margin: 16px 0; }
    .time-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toggle-switch { display: flex; align-items: center; gap: 12px; }
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; min-height: 0; padding: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: 0.3s; border-radius: 28px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: 0.3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(22px); }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes loadingBar { 0% { width: 0%; } 100% { width: 100%; } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
    @supports (padding: max(0px)) { body { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Calendar</h1>
      <div class="header-actions">
        <button class="header-btn" onclick="exportEvents()">Export</button>
        <button class="header-btn" onclick="openSettings()">Settings</button>
      </div>
    </header>

    <div id="status-message"></div>

    <div class="section-tabs">
      <button class="tab-button active" onclick="showTab('calendar')">Calendar</button>
      <button class="tab-button" onclick="showTab('add')">Add Event</button>
    </div>

    <div class="main-content">
      <div id="calendar-tab" class="tab-content">
        <div class="calendar-header">
          <div class="month-year" id="month-year"></div>
          <div class="month-nav">
            <button onclick="previousMonth()">←</button>
            <button class="header-btn" onclick="toggleView()" style="padding: 6px 10px; font-size: 12px;">Week</button>
            <button onclick="nextMonth()">→</button>
          </div>
        </div>
        <div id="month-view"><div class="calendar-grid" id="calendar-grid"></div></div>
        <div id="week-view" style="display: none;">
          <div class="week-view-container">
            <div class="week-header">
              <div class="week-time-label"></div>
              <div class="week-day-header" id="week-day-1"></div><div class="week-day-header" id="week-day-2"></div><div class="week-day-header" id="week-day-3"></div><div class="week-day-header" id="week-day-4"></div><div class="week-day-header" id="week-day-5"></div><div class="week-day-header" id="week-day-6"></div><div class="week-day-header" id="week-day-7"></div>
            </div>
            <div class="week-grid" id="week-grid"></div>
          </div>
        </div>
        <div class="events-container">
          <div class="sidebar-section"><div class="sidebar-title">Today</div><div id="today-events"></div></div>
          <div class="sidebar-section"><div class="sidebar-title">Upcoming</div><div id="upcoming-events"></div></div>
        </div>
      </div>

      <div id="add-tab" class="tab-content" style="display: none;">
        <div class="section">
          <div class="section-title">Quick Add</div>
          <div class="section-subtitle">Type your event naturally</div>
          <div class="input-group"><textarea id="event-input" placeholder="e.g., lunch tomorrow at noon" maxlength="200"></textarea></div>
          <button class="btn-primary" id="parse-btn" onclick="parseEvent()">Add Event</button>
          <div class="divider"></div>
          <div class="section-title">Manual Entry</div>
          <div class="input-group"><label>Title</label><input type="text" id="title-input" placeholder="Event name" maxlength="100"></div>
          <div class="input-group"><label>Date</label><input type="date" id="date-input"></div>
          <div class="input-group"><label>Time</label><div class="time-inputs"><div><label style="font-size: 11px;">Start</label><input type="time" id="time-input"></div><div><label style="font-size: 11px;">End</label><input type="time" id="end-time-input"></div></div></div>
          <div class="input-group"><label>Notes</label><textarea id="desc-input" placeholder="Add details..." maxlength="500"></textarea></div>
          <button class="btn-secondary" onclick="addEventManually()">Save Event</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmation-overlay">
    <div class="modal confirmation-modal">
      <h3 class="confirmation-title">Confirm Event</h3>
      <div class="confirmation-content" id="confirmation-content"></div>
      <div class="confirmation-buttons">
        <button class="btn-secondary" style="flex: 1;" onclick="confirmParsedEvent()">Confirm</button>
        <button class="btn-secondary" style="flex: 1;" onclick="closeConfirmation()">Edit</button>
        <button class="btn-danger" style="flex: 1;" onclick="closeConfirmation()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <h3 id="modal-title">Edit Event</h3>
      <div class="input-group"><label>Title</label><input type="text" id="modal-title-input" placeholder="Event name" maxlength="100"></div>
      <div class="input-group"><label>Date</label><input type="date" id="modal-date-input"></div>
      <div class="input-group"><label>Time</label><div class="time-inputs"><div><label style="font-size: 11px;">Start</label><input type="time" id="modal-time-input"></div><div><label style="font-size: 11px;">End</label><input type="time" id="modal-end-time-input"></div></div></div>
      <div class="input-group"><label>Notes</label><textarea id="modal-desc-input" placeholder="Add details..." maxlength="500"></textarea></div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-secondary" style="flex: 1;" onclick="saveEditedEvent()">Save</button>
        <button class="btn-danger" style="flex: 1;" onclick="deleteEditingEvent()">Delete</button>
        <button class="btn-secondary" style="flex: 1;" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="settings-overlay">
    <div class="modal" id="settings-modal">
      <h3>Notification Settings</h3>
      <div class="section" style="border: none; padding: 0;"><div class="toggle-switch"><label for="notif-toggle" style="margin: 0; text-transform: none; font-weight: 500;">Enable Notifications</label><label class="switch"><input type="checkbox" id="notif-toggle" onchange="toggleNotifications()"><span class="slider"></span></label></div></div>
      <div style="margin-top: 16px;"><button class="btn-secondary" style="width: 100%;" onclick="closeSettings()">Done</button></div>
    </div>
  </div>

  <script>
    let currentDate = new Date(); let allEvents = []; let selectedDate = null; let isWeekView = false; let editingEventId = null; let pendingParsedEvent = null; let notificationsEnabled = false; let searchFilter = '';

    async function init() { await loadEvents(); loadNotificationSettings(); renderCalendar(); renderUpcomingEvents(); setTodayDate(); checkNotificationPermission(); scheduleNotifications(); }
    function showTab(tab) { document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none'); document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active')); document.getElementById(tab + '-tab').style.display = 'block'; event.target.classList.add('active'); }
    function toggleView() { isWeekView = !isWeekView; if (isWeekView) { document.getElementById('month-view').style.display = 'none'; document.getElementById('week-view').style.display = 'block'; renderWeekView(); } else { document.getElementById('month-view').style.display = 'block'; document.getElementById('week-view').style.display = 'none'; renderCalendar(); } }
    
    async function loadEvents() { try { const response = await fetch('/api/events'); allEvents = await response.json(); localStorage.setItem('calendarEvents', JSON.stringify(allEvents)); } catch (err) { console.error('Error loading events:', err); const saved = localStorage.getItem('calendarEvents'); allEvents = saved ? JSON.parse(saved) : []; showStatus('Using local storage', 'success'); } }
    
    function loadNotificationSettings() { const saved = localStorage.getItem('notificationSettings'); if (saved) { const settings = JSON.parse(saved); notificationsEnabled = settings.enabled || false; } updateSettingsUI(); }
    function saveNotificationSettings() { localStorage.setItem('notificationSettings', JSON.stringify({ enabled: notificationsEnabled })); }
    function updateSettingsUI() { document.getElementById('notif-toggle').checked = notificationsEnabled; }
    function openSettings() { document.getElementById('settings-overlay').classList.add('active'); updateSettingsUI(); }
    function closeSettings() { document.getElementById('settings-overlay').classList.remove('active'); }
    function toggleNotifications() { notificationsEnabled = document.getElementById('notif-toggle').checked; saveNotificationSettings(); updateSettingsUI(); if (notificationsEnabled) { requestNotificationPermission(); } else { showStatus('Notifications disabled', 'success'); } }
    
    async function parseEvent() { const input = document.getElementById('event-input').value.trim(); if (!input) { showStatus('Type an event', 'error'); return; } const btn = document.getElementById('parse-btn'); btn.disabled = true; btn.classList.add('loading'); try { const response = await fetch('/api/events/parse', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: input }) }); const data = await response.json(); if (!response.ok || data.error) { showStatus(data.error || 'Try: "lunch tomorrow at noon"', 'error'); } else { pendingParsedEvent = data; showConfirmationModal(data); } } catch (err) { showStatus('Error parsing event', 'error'); } finally { btn.disabled = false; btn.classList.remove('loading'); } }
    
    function showConfirmationModal(event) { const timeStr = formatEventTime(event.time, event.endTime); const dateObj = new Date(event.date); const dateStr = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); let html = `<div class="confirmation-detail"><div class="confirmation-label">Event</div><div class="confirmation-value">${event.title}</div></div><div class="confirmation-detail"><div class="confirmation-label">Date</div><div class="confirmation-value">${dateStr}</div></div>`; if (timeStr) { html += `<div class="confirmation-detail"><div class="confirmation-label">Time</div><div class="confirmation-value">${timeStr}</div></div>`; } document.getElementById('confirmation-content').innerHTML = html; document.getElementById('confirmation-overlay').classList.add('active'); }
    
    async function confirmParsedEvent() { if (!pendingParsedEvent) return; try { await fetch('/api/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pendingParsedEvent) }); showStatus(`✓ ${pendingParsedEvent.title} added`, 'success'); document.getElementById('event-input').value = ''; closeConfirmation(); await loadEvents(); renderCalendar(); renderUpcomingEvents(); scheduleNotifications(); } catch (err) { showStatus('Error saving event', 'error'); } }
    
    function closeConfirmation() { document.getElementById('confirmation-overlay').classList.remove('active'); pendingParsedEvent = null; }
    
    async function addEventManually() { const title = document.getElementById('title-input').value.trim(); const date = document.getElementById('date-input').value; const time = document.getElementById('time-input').value; const endTime = document.getElementById('end-time-input').value; const description = document.getElementById('desc-input').value.trim(); if (!title || !date) { showStatus('Title and date required', 'error'); return; } try { const response = await fetch('/api/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, date, time: time || null, endTime: endTime || null, description }) }); const data = await response.json(); showStatus(`✓ ${data.title} saved`, 'success'); document.getElementById('title-input').value = ''; document.getElementById('date-input').value = ''; document.getElementById('time-input').value = ''; document.getElementById('end-time-input').value = ''; document.getElementById('desc-input').value = ''; setTodayDate(); await loadEvents(); renderCalendar(); renderUpcomingEvents(); scheduleNotifications(); } catch (err) { showStatus('Error saving event', 'error'); } }
    
    async function deleteEvent(id) { try { const response = await fetch(`/api/events/${id}`, { method: 'DELETE' }); if (response.ok) { showStatus('Event deleted', 'success'); await loadEvents(); renderCalendar(); renderUpcomingEvents(); scheduleNotifications(); } } catch (err) { showStatus('Error deleting', 'error'); } }
    
    function openEditModal(eventId) { const event = allEvents.find(e => e.id === eventId); if (!event) return; editingEventId = eventId; document.getElementById('modal-title-input').value = event.title; document.getElementById('modal-date-input').value = event.date; document.getElementById('modal-time-input').value = event.time || ''; document.getElementById('modal-end-time-input').value = event.endTime || ''; document.getElementById('modal-desc-input').value = event.description || ''; document.getElementById('modal-overlay').classList.add('active'); }
    
    function closeModal() { document.getElementById('modal-overlay').classList.remove('active'); editingEventId = null; }
    
    async function saveEditedEvent() { const title = document.getElementById('modal-title-input').value.trim(); const date = document.getElementById('modal-date-input').value; const time = document.getElementById('modal-time-input').value; const endTime = document.getElementById('modal-end-time-input').value; const description = document.getElementById('modal-desc-input').value.trim(); if (!title || !date) { showStatus('Title and date required', 'error'); return; } try { const response = await fetch(`/api/events/${editingEventId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, date, time: time || null, endTime: endTime || null, description }) }); const data = await response.json(); showStatus(`✓ ${data.title} updated`, 'success'); closeModal(); await loadEvents(); renderCalendar(); renderUpcomingEvents(); scheduleNotifications(); } catch (err) { showStatus('Error saving event', 'error'); } }
    
    async function deleteEditingEvent() { if (!confirm('Delete this event?')) return; await deleteEvent(editingEventId); closeModal(); }
    
    function formatTimeEastern(timeStr) { if (!timeStr) return ''; const [hours, minutes] = timeStr.split(':'); const hour = parseInt(hours); const ampm = hour >= 12 ? 'PM' : 'AM'; const displayHour = hour % 12 || 12; return `${displayHour}:${minutes} ${ampm}`; }
    
    function formatEventTime(startTime, endTime) { if (!startTime) return ''; const start = formatTimeEastern(startTime); const end = endTime ? formatTimeEastern(endTime) : ''; return end ? `${start} - ${end}` : start; }
    
    function renderCalendar() { const year = currentDate.getFullYear(); const month = currentDate.getMonth(); document.getElementById('month-year').textContent = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); const firstDay = new Date(year, month, 1); const lastDay = new Date(year, month + 1, 0); const daysInMonth = lastDay.getDate(); const startingDayOfWeek = firstDay.getDay(); let html = ''; const days = ['S', 'M', 'T', 'W', 'T', 'F', 'S']; days.forEach(day => { html += `<div class="day-header">${day}</div>`; }); const prevMonthDays = new Date(year, month, 0).getDate(); for (let i = startingDayOfWeek - 1; i >= 0; i--) { html += `<div class="day-cell other-month">${prevMonthDays - i}</div>`; } const today = new Date(); today.setHours(0, 0, 0, 0); for (let day = 1; day <= daysInMonth; day++) { const date = new Date(year, month, day); const dateStr = date.toISOString().split('T')[0]; const isToday = dateStr === today.toISOString().split('T')[0]; const isSelected = dateStr === selectedDate; const dayEvents = allEvents.filter(e => e.date === dateStr); const eventCount = dayEvents.length; html += `<div class="day-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="selectDate('${dateStr}')"><div class="day-number">${day}</div>${eventCount > 0 ? `<div class="day-count">${eventCount}</div>` : ''}</div>`; } const remainingCells = 42 - (startingDayOfWeek + daysInMonth); for (let i = 1; i <= remainingCells; i++) { html += `<div class="day-cell other-month">${i}</div>`; } document.getElementById('calendar-grid').innerHTML = html; }
    
    function renderWeekView() { const weekStart = new Date(currentDate); weekStart.setDate(currentDate.getDate() - currentDate.getDay()); const today = new Date(); today.setHours(0, 0, 0, 0); for (let i = 0; i < 7; i++) { const date = new Date(weekStart); date.setDate(date.getDate() + i); const dateStr = date.toISOString().split('T')[0]; const isToday = dateStr === today.toISOString().split('T')[0]; const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']; const header = document.getElementById(`week-day-${i + 1}`); header.innerHTML = `<div class="week-day-name">${dayNames[date.getDay()]}</div><div class="week-day-date ${isToday ? 'today' : ''}">${date.getDate()}</div>`; } let html = '<div class="week-time-slots">'; for (let hour = 0; hour < 24; hour++) { const timeStr = hour.toString().padStart(2, '0') + ':00'; html += `<div class="time-slot">${formatTimeEastern(timeStr)}</div>`; } html += '</div>'; for (let i = 0; i < 7; i++) { const date = new Date(weekStart); date.setDate(date.getDate() + i); const dateStr = date.toISOString().split('T')[0]; const isToday = dateStr === today.toISOString().split('T')[0]; const dayEvents = allEvents.filter(e => e.date === dateStr); html += `<div class="week-day-column ${isToday ? 'today' : ''}">`; dayEvents.forEach(event => { if (!event.time) return; const [hours, minutes] = event.time.split(':').map(Number); const topPercent = (hours + minutes / 60) * (100 / 24); const duration = event.endTime ? ((event.endTime.split(':')[0] - event.time.split(':')[0]) * 60 + (event.endTime.split(':')[1] - event.time.split(':')[1])) / 60 : 1; const heightPercent = (duration / 24) * 100; const timeStr = formatEventTime(event.time, event.endTime); html += `<div class="week-event" style="top: ${topPercent}%; height: ${Math.max(heightPercent, 8)}%;" onclick="openEditModal('${event.id}')"><div class="week-event-title">${event.title}</div><div class="week-event-time">${timeStr}</div></div>`; }); html += '</div>'; } document.getElementById('week-grid').innerHTML = html; }
    
    function renderUpcomingEvents() { const today = new Date(); today.setHours(0, 0, 0, 0); const todayEvents = allEvents.filter(e => e.date === today.toISOString().split('T')[0]).sort((a, b) => (a.time || '').localeCompare(b.time || '')); let todayHtml = ''; if (todayEvents.length === 0) { todayHtml = '<div class="empty-state"><div class="empty-state-icon">✓</div>No events today</div>'; } else { todayEvents.forEach(event => { const timeStr = formatEventTime(event.time, event.endTime); todayHtml += `<div class="event-item" onclick="openEditModal('${event.id}')"><div class="event-details"><div class="event-title">${event.title}</div>${timeStr ? `<div class="event-meta">${timeStr}</div>` : ''}${event.description ? `<div class="event-meta">${event.description}</div>` : ''}</div></div>`; }); } document.getElementById('today-events').innerHTML = todayHtml; const upcoming = allEvents.filter(e => new Date(e.date) > today).sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 5); let upcomingHtml = ''; if (upcoming.length === 0) { upcomingHtml = '<div class="empty-state"><div class="empty-state-icon">📅</div>No upcoming events</div>'; } else { upcoming.forEach(event => { const parts = event.date.split('-'); const date = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2])); const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); const timeStr = formatEventTime(event.time, event.endTime); upcomingHtml += `<div class="event-item" onclick="openEditModal('${event.id}')"><div class="event-details"><div class="event-title">${event.title}</div><div class="event-meta">${dateStr}${timeStr ? ` • ${timeStr}` : ''}</div>${event.description ? `<div class="event-meta">${event.description}</div>` : ''}</div></div>`; }); } document.getElementById('upcoming-events').innerHTML = upcomingHtml; }
    
    function previousMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
    function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }
    function selectDate(dateStr) { selectedDate = dateStr; renderCalendar(); }
    function setTodayDate() { const today = new Date().toISOString().split('T')[0]; document.getElementById('date-input').value = today; }
    function showStatus(message, type) { const el = document.getElementById('status-message'); el.innerHTML = message; el.className = `status-message ${type}`; setTimeout(() => { el.innerHTML = ''; el.className = ''; }, 3000); }
    
    function checkNotificationPermission() { if ('Notification' in window && notificationsEnabled) { if (Notification.permission === 'granted') { return; } } }
    
    function requestNotificationPermission() { if (!('Notification' in window)) { showStatus('Notifications not supported', 'error'); notificationsEnabled = false; saveNotificationSettings(); updateSettingsUI(); return; } if (Notification.permission === 'default') { Notification.requestPermission().then(permission => { if (permission !== 'granted') { notificationsEnabled = false; saveNotificationSettings(); updateSettingsUI(); showStatus('Notification permission denied', 'error'); } else { showStatus('Notifications enabled', 'success'); scheduleNotifications(); } }); } }
    
    function scheduleNotifications() { if (!notificationsEnabled || !('Notification' in window)) return; const now = new Date(); allEvents.forEach(event => { if (!event.time) return; const [hours, minutes] = event.time.split(':').map(Number); const eventTime = new Date(event.date); eventTime.setHours(hours, minutes); const notifyTime = new Date(eventTime.getTime() - 15 * 60000); if (notifyTime > now) { const timeout = notifyTime.getTime() - now.getTime(); setTimeout(() => { if (Notification.permission === 'granted') { new Notification(`Upcoming: ${event.title}`, { body: `${formatTimeEastern(event.time)} - ${event.date}`, tag: event.id }); } }, timeout); } }); }
    
    function exportEvents() { const dataStr = JSON.stringify(allEvents, null, 2); const dataBlob = new Blob([dataStr], { type: 'application/json' }); const url = URL.createObjectURL(dataBlob); const link = document.createElement('a'); link.href = url; link.download = `calendar-backup-${new Date().toISOString().split('T')[0]}.json`; link.click(); showStatus('Events exported', 'success'); }
    
    window.addEventListener('load', init);
  </script>
